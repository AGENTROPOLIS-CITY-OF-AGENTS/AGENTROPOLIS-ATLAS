name: Vendor baseline qualification

on:
  pull_request:
  push:
    branches:
      - fix/vendor-loop-baseline-20261014

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify quantized public shell
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          test $(wc -c < script.js) -le 358400
          ! grep -Eiq '(three|@react-three|drei)' index.html script.js
          ! grep -Eiq '<(video|audio)[^>]*autoplay' index.html

      - name: Regression (no network)
        run: python3 tests/vendor_baseline_regression.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install smoke driver
        working-directory: tests
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Install Google Chrome
        run: |
          curl -fsSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb

      - name: Headless smoke
        working-directory: tests
        run: |
          if [ -x /usr/bin/google-chrome-stable ]; then
            export CHROME_PATH=/usr/bin/google-chrome-stable
          elif [ -x /usr/bin/google-chrome ]; then
            export CHROME_PATH=/usr/bin/google-chrome
          else
            echo "google-chrome binary not found" >&2
            exit 1
          fi
          node smoke_loop_baseline.mjs
