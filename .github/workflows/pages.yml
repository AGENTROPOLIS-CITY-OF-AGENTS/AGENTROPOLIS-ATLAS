name: Deploy ATLAS Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "agentropolis-loop-baseline.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify quantized public shell
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f agentropolis-loop-baseline.js
          test $(wc -c < script.js) -le 358400
          ! grep -Eiq '(three|@react-three|drei)' index.html script.js
          ! grep -Eiq '<(video|audio)[^>]*autoplay' index.html

      - name: Qualify vendored baseline
        run: python3 tests/vendor_baseline_regression.py

      - name: Stage public shell
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css script.js agentropolis-loop-baseline.js _site/
          python3 tests/vendor_baseline_regression.py --stage-site
          test ! -e _site/tests
          test ! -e _site/services
          test ! -e _site/docs
          test ! -e _site/policies
          test ! -e _site/skills
          test ! -e _site/.agentropolis
          find _site -type f -print | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload ATLAS public shell
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
